# A tag v* runs CI, which also builds both Linux architectures, and
# publishes those binaries as the release. install.sh downloads from here.
#
# A tag with a suffix, such as v0.7.0-rc1, is published as a pre-release:
# GitHub's latest release skips it, so neither installs nor the about
# page's update check see it. It is installed by pointing TENKSTACK_RELEASE
# at the tag's download URL.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # The binary reports VERSION and the update check compares it with the
  # tag, so a tag without the matching VERSION would ship a release that
  # offers itself as an update forever.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false
      - name: Version matches the tag
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "VERSION says $version but the tag is $GITHUB_REF_NAME"; exit 1
          fi

  checks:
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: tenkstack-linux-*
          merge-multiple: true
      - name: Checksums
        run: sha256sum tenkstack-linux-* | tee SHA256SUMS
      # The release text is the tag's own message, which the about page
      # shows under 說明. checkout can leave the tag lightweight, so it is
      # fetched again as the annotated object before it is read.
      - name: Release notes
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            tenkstack-linux-amd64
            tenkstack-linux-arm64
            SHA256SUMS
