# llama.cpp: the engine every model uses unless it says otherwise.
key: llamacpp
name: llama.cpp
order: 0
default: true
program: llama-server
summary: GGUF 模型的標準執行環境，任何顯示卡都能跑，也能把一部分放到 CPU 上
category: llm
formats: [gguf]
site: https://github.com/ggml-org/llama.cpp
icon: icon.svg
icon_source: https://github.com/ggml-org/llama.cpp/blob/master/media/llama1-icon-transparent.svg

# The model form with GGUF files, layers, a projector and sampling, and the
# /props and /slots endpoints the console reads from a running server.
form: llama

env_prefix: LLAMA
# The names llama.cpp had before the registry existed. A config written then
# names ${llama-intel} and llama-server-intel.sh, so they stay.
macro_prefix: llama-
script_prefix: llama-server-

builds:
  intel:
    image: ghcr.io/ggml-org/llama.cpp:server-intel
    label: 最新版
    note: 跟著 llama.cpp 每次發布更新，新模型最快能用
    alternatives:
      - image: ghcr.io/ggml-org/llama.cpp:server-intel-b11176
        label: 已驗證版（b11176）
        note: 這個專案在 Arc Pro B70 上一直在用的版本，不會自己變動
    # Run on an Arc Pro B70, 2026-09-25, build b11151: Qwen3.8-27B Q6_K_XL,
    # q8_0 KV, ubatch 1024, one card -- prompt 889 tok/s at 4K and 952 at
    # 16K, generation 18.3 and 15.9. The image is built with GGML_SYCL_F16,
    # which is where its prompt speed comes from.
    verified: true
    # Copies between cards go through the host. The image's default, the
    # SYCL API, hung two B70s in --split-mode tensor on the first prompt;
    # llama.cpp's SYCL guide calls host forwarding the stable choice for
    # several cards, at a cost of 2-5%. One card never copies.
    flags: [--device, /dev/dri, -e, GGML_SYCL_DEV2DEV_MEMCPY=2]
    # The GPU driver in the image compiles the SYCL kernels on a server's
    # first run and caches them here. Kept on the host, a start after the
    # first takes 8.6 s instead of 41 (Spark-X2.5-4B, one B70); lost with
    # each container, every model switch paid the 35 s again.
    cache_dir: /root/.cache/neo_compiler_cache
  amd:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm
  nvidia:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    requires: nvidia-container-toolkit
    verified: true

# Runs on any vendor's card, offered as a variant rather than a default: it
# is slower and needs a Vulkan driver on the host.
fallback:
  label: Vulkan（通用備援）
  image: ghcr.io/ggml-org/llama.cpp:server-vulkan
  requires: vulkan ICD
  flags: [--device, /dev/dri, --gpus, all, -e, "NVIDIA_DRIVER_CAPABILITIES=graphics,compute,utility"]
