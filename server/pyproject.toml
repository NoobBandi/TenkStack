[project]
name = "tenkstack"
version = "0.5.0"
description = "Self-hosted control panel for a home AI box: models, images and cards from any vendor, each told what it is for"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "NoobBandi" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "huggingface-hub>=1.27.0",
    "pillow>=11.0",
    "ruamel-yaml>=0.19.1",
    "uvicorn[standard]>=0.52.1",
]


[project.urls]
Homepage = "https://github.com/NoobBandi/TenkStack"
Source = "https://github.com/NoobBandi/TenkStack"

[tool.uv]
package = false
