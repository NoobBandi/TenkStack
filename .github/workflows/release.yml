# A tag v* builds the console for both Linux architectures and attaches the
# binaries to the release. install.sh downloads from here.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The frontend's build stamp is `git describe`; without the tags
          # it would show a bare hash where the release name belongs.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum
      - name: Frontend
        run: cd web && npm ci && npm run build
      - name: Binaries
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch server-go/build.sh
            mv server-go/tenkstack "tenkstack-linux-$arch"
          done
          sha256sum tenkstack-linux-* > SHA256SUMS
      - name: Checks
        run: cd server-go && go vet ./... && go test ./...
      # The release text is the tag's own message, which the about page
      # shows under 說明. checkout can leave the tag lightweight, so it is
      # fetched again as the annotated object before it is read.
      - name: Release notes
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            tenkstack-linux-amd64
            tenkstack-linux-arm64
            SHA256SUMS
