# vLLM: Hugging Face safetensors served for throughput.
key: vllm
name: vLLM
order: 10
program: vllm serve
summary: 高吞吐的推論伺服器，直接跑 Hugging Face 的 safetensors 模型，多人同時使用時最快
category: llm
formats: [safetensors]
site: https://github.com/vllm-project/vllm
icon: icon.png
icon_source: https://github.com/vllm-project/vllm/blob/main/docs/assets/logos/vllm-logo-only-light.png

# An OpenAI-compatible server: one directory of weights, a context length, a
# card count and a memory share. `flags` is how this engine spells each.
form: server
flags:
  model: --model
  served_name: --served-model-name
  context: --max-model-len
  tensor_parallel: --tensor-parallel-size
  memory: --gpu-memory-utilization
  quantization: --quantization
# Refuses a request whose max_tokens reaches the context length, where
# llama-server treats it as a ceiling; the proxy leaves it out.
drop_max_tokens: true
# Tool calls work once the entry names a tool parser, which the recommended
# flags below do for the families that have one.
tools: true

# The chat panel's sampling controls, as vLLM names them. The reasoning
# budget is left out: vLLM takes one only from a server started with
# --reasoning-config, and refuses the request otherwise.
sampling:
  temperature: temperature
  top_p: top_p
  top_k: top_k
  min_p: min_p
  repeat_penalty: repetition_penalty
  presence_penalty: presence_penalty
  frequency_penalty: frequency_penalty
  seed: seed
# With speculative decoding on (MTP, a draft model), vLLM refuses a request
# that sets these at all, and the chat shows nothing. The panel hides them
# for such an entry and the proxy leaves them out for every client.
speculation:
  flag: --speculative-config
  refuses: [min_p, logit_bias]

env_prefix: VLLM

builds:
  intel:
    image: intel/llm-scaler-vllm:0.26.0-b2
    verified: true
    # OneCCL opens every render node by path, so by-path goes in read-only.
    # XPU graph replays a whole decode step instead of launching each kernel
    # from Python: 14.6 -> 34.8 tok/s for a 27B on two B70s. It is off in the
    # image by default and has no effect with --enforce-eager. The Triton and
    # Inductor caches default to /tmp, which dies with the container; kept in
    # cache_dir they save ~70 s of every start.
    flags: [--device, /dev/dri, -v, /dev/dri/by-path:/dev/dri/by-path:ro, --shm-size, 16g, -e, HF_HUB_OFFLINE=1,
            -e, VLLM_XPU_ENABLE_XPU_GRAPH=1, -e, TRITON_CACHE_DIR=/root/.cache/vllm/triton,
            -e, TORCHINDUCTOR_CACHE_DIR=/root/.cache/vllm/inductor]
    cache_dir: /root/.cache/vllm
  nvidia:
    image: vllm/vllm-openai:latest
    requires: nvidia-container-toolkit
    flags: [--gpus, all, --ipc, host, -e, HF_HUB_OFFLINE=1]
    cache_dir: /root/.cache/vllm
  amd:
    image: rocm/vllm:latest
    flags: [--device, /dev/dri, --device, /dev/kfd, --group-add, video, --security-opt, seccomp=unconfined, --ipc, host, -e, HF_HUB_OFFLINE=1]
    # The ROCm image's entrypoint is a shell, not the server.
    command: [vllm, serve]
    cache_dir: /root/.cache/vllm

# Quantisations applied while bf16 weights load. The image is asked which it
# has; a publisher's own quantisation (fp8, awq, gptq) needs none of these.
online_quantization:
  - value: fp8
    label: FP8（線上量化）
    note: 顯存減半，品質幾乎不變
    shrink: 0.5
  - value: sym_int4
    label: Int4（線上量化）
    note: 顯存四分之一，品質略降
    shrink: 0.25

# Flags a model family needs, offered when its folder is picked. The first
# matching rule wins for each flag; `match` is a regular expression against
# the architecture in config.json.
recommended:
  # Intel's image only. Compiled with its default split points, two cards
  # emit garbage (the all-reduce lands inside a captured graph); splitting at
  # all_reduce too is the image's default list plus that one op. Harmless on
  # one card. Graphs are recorded for up to four requests at once. Other
  # vendors' builds keep vLLM's own defaults, which this was not tested on.
  - match: ^Qwen3_5
    vendors: [intel]
    flags:
      - '--compilation-config ''{"cudagraph_mode":"FULL_DECODE_ONLY","splitting_ops":["vllm::unified_attention_with_output","vllm::unified_mla_attention_with_output","vllm::mamba_mixer2","vllm::mamba_mixer","vllm::short_conv","vllm::linear_attention","vllm::plamo2_mamba_mixer","vllm::qwen_gdn_attention_core","vllm::gdn_attention_core_xpu","vllm::olmo_hybrid_gdn_full_forward","vllm::kda_attention","vllm::sparse_attn_indexer","vllm::rocm_aiter_sparse_attn_indexer","vllm::deepseek_v4_attention","vllm::hpc_rope_norm_forward","vllm::unified_kv_cache_update","vllm::unified_mla_kv_cache_update","vllm::all_reduce"]}'''
      - --max-num-seqs 4
    note: 整段解碼錄成 XPU graph（雙卡 27B 從 14.6 提升到 34.8 tok/s），在 all_reduce 切開才不會輸出亂碼
  # Qwen3.5/3.8 write tool calls as XML, which hermes does not read. A
  # property of the model, so every vendor.
  - match: ^Qwen3_5
    flags: [--tool-call-parser qwen3_coder]
    note: Qwen3.5/3.8 的工具呼叫是 XML 格式
  - match: ^Qwen3
    flags: [--reasoning-parser qwen3, --enable-auto-tool-choice, --tool-call-parser hermes]
    note: 思考過程與工具呼叫分開回傳
