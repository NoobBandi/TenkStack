# Every push to main and every pull request: the backend's checks, the
# frontend's build and lint, the installer's, and a binary built and started
# the way a release is. release.yml calls this with release: true, which
# also builds arm64 and keeps both binaries for it to publish, so a release
# ships exactly what was checked instead of building everything again.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

# A newer push to the same branch makes a running check moot. Called from
# release.yml, the group is the tag's and is never shared.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Its own cache: setup-go keys one cache on go.sum for every job, and
      # the test build and the release build compile different objects, so
      # whichever job saved first left the other compiling from cold.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-test-${{ runner.os }}-
      - name: Format
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [[ -n $unformatted ]]; then echo "not gofmt'ed:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  binary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # arm64 only for a release; the two build side by side.
        arch: ${{ fromJSON(inputs.release && '["amd64","arm64"]' || '["amd64"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The frontend's build stamp is `git describe`.
          fetch-depth: 0
      # pnpm first, so setup-node can cache its store. The version is the
      # one web/package.json pins.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-${{ runner.os }}-${{ matrix.arch }}-
      # build runs check-frames and tsc -b before vite.
      - name: Frontend
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: Lint
        if: matrix.arch == 'amd64'
        run: cd web && pnpm lint
      - name: Build
        run: GOARCH=${{ matrix.arch }} scripts/build.sh && mv tenkstack tenkstack-linux-${{ matrix.arch }}
      # The runner is amd64; the arm64 build comes from the same source.
      - name: Smoke
        if: matrix.arch == 'amd64'
        run: scripts/smoke.sh tenkstack-linux-amd64 "$(tr -d '[:space:]' < VERSION)"
      - if: inputs.release
        uses: actions/upload-artifact@v7
        with:
          name: tenkstack-linux-${{ matrix.arch }}
          path: tenkstack-linux-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax
        run: for f in install.sh scripts/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck -S warning install.sh scripts/*.sh
