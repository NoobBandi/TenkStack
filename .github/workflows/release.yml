# A tag v* builds the console for both Linux architectures and attaches the
# binaries to the release. install.sh downloads from here.
#
# A tag with a suffix, such as v0.7.0-rc1, is published as a pre-release:
# GitHub's latest release skips it, so neither installs nor the about
# page's update check see it. It is installed by pointing TENKSTACK_RELEASE
# at the tag's download URL.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The frontend's build stamp is `git describe`; without the tags
          # it would show a bare hash where the release name belongs.
          fetch-depth: 0
      # The binary reports VERSION and the update check compares it with
      # the tag, so a tag without the matching VERSION would ship a release
      # that offers itself as an update forever.
      - name: Version matches the tag
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "VERSION says $version but the tag is $GITHUB_REF_NAME"; exit 1
          fi
      # pnpm first, so setup-node can cache its store. The version is the
      # one web/package.json pins.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Frontend
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: Binaries
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch scripts/build.sh
            mv tenkstack "tenkstack-linux-$arch"
          done
          sha256sum tenkstack-linux-* > SHA256SUMS
      # The runner is amd64; the arm64 build comes from the same source.
      - name: Smoke
        run: scripts/smoke.sh tenkstack-linux-amd64 "${GITHUB_REF_NAME#v}"
      # The release text is the tag's own message, which the about page
      # shows under 說明. checkout can leave the tag lightweight, so it is
      # fetched again as the annotated object before it is read.
      - name: Release notes
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            tenkstack-linux-amd64
            tenkstack-linux-arm64
            SHA256SUMS
